name: Compilation Android

# À chaque envoi : compile l'app (vérification). Sur la branche main, ou quand la compilation est lancée à la main
# (onglet Actions → Run workflow) : publie aussi l'APK de test dans les Releases.
# Si la clé de signature est configurée (secrets SM_KEYSTORE_*), produit en plus le fichier de publication pour Google Play (AAB).
on:
  push:
    paths: ['web/**', 'android/**', 'tools/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

# Une seule compilation à la fois par branche : un nouvel envoi remplace celle qui est en cours.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SM_VERSION_CODE: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.SM_KEYSTORE_BASE64 != '' }}
      SM_KEYSTORE_PASSWORD: ${{ secrets.SM_KEYSTORE_PASSWORD }}
      SM_KEY_ALIAS: ${{ secrets.SM_KEY_ALIAS }}
      SM_KEY_PASSWORD: ${{ secrets.SM_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Textes depuis Sefaria (Israël et diaspora)
        run: node tools/fetch_sefaria.js

      - name: Copier l'application web dans l'app Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Clé de signature (si elle est configurée)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.SM_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cle.jks"
          echo "SM_KEYSTORE_FILE=$RUNNER_TEMP/cle.jks" >> "$GITHUB_ENV"

      # Le serveur des outils de compilation refuse parfois les téléchargements (erreur 429) : on réessaie, ce qui est déjà téléchargé est gardé.
      - name: Compiler l'APK de test
        working-directory: android
        run: |
          for essai in 1 2 3; do
            gradle assembleDebug --no-daemon && exit 0
            echo "Échec de l'essai $essai : nouvelle tentative dans une minute"
            sleep 60
          done
          exit 1

      - name: Compiler la version de publication (AAB signé)
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: gradle bundleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: shnayim-mikra-test-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: env.HAS_KEY == 'true'
        with:
          name: shnayim-mikra-google-play-aab
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Publier l'APK de test dans les Releases du dépôt
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCHE: ${{ github.ref_name }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk shnayim-mikra-test.apk
          cp docs/traductions-a-relire.csv traductions-a-relire.csv
          TAG="test-${{ github.run_number }}"
          PARASHA=$(node -e "global.window={};require('./web/data/text.js');const T=window.SM_TEXT;const t=new Date().toISOString().slice(0,10);const w=T&&T.diaspora?T.diaspora.weeks.find(x=>x.shabbatISO>=t&&!x.holiday):null;console.log(w?w.parasha:'textes d exemple')")
          SUITE=""
          if [ "$BRANCHE" != "main" ]; then SUITE=" (avant fusion)"; fi
          {
            echo "Version de test n°${{ github.run_number }}$SUITE. Paracha : $PARASHA (textes de Sefaria)."
            echo
            echo "**Installer sur Android** : télécharger \`shnayim-mikra-test.apk\`, puis autoriser l'installation depuis cette source. Si une ancienne version de test est déjà installée, la désinstaller d'abord."
            echo
            echo "**Relecture des traductions** : au premier écran, choisir la langue à relire (par exemple تونسي). Le fichier \`traductions-a-relire.csv\` s'ouvre dans un tableur : il liste tous les textes en français, tounsi et darija, avec une colonne pour les corrections."
          } > notes.md
          gh release create "$TAG" shnayim-mikra-test.apk traductions-a-relire.csv --prerelease --target "${{ github.sha }}" \
            --title "APK de test n°${{ github.run_number }} — $PARASHA$SUITE" --notes-file notes.md
