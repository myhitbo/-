name: APK de test

on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', 'tools/**', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      diaspora:
        description: "Calendrier de la diaspora (1) ou d'Israël (0)"
        default: '1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Textes de la semaine depuis Sefaria
        env:
          SM_DIASPORA: ${{ github.event.inputs.diaspora || '1' }}
        run: python3 tools/fetch_sefaria.py

      - name: Copier l'application web dans l'APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: shnayim-mikra-test-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publier l'APK dans les Releases du dépôt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk shnayim-mikra-test.apk
          TAG="test-${{ github.run_number }}"
          PARASHA=$(python3 -c "import json,re;t=open('web/data/text.js').read();m=re.search(r'= (\{.*\});',t,re.S);print(json.loads(m.group(1))['parasha'] if m else 'textes d exemple')")
          gh release create "$TAG" shnayim-mikra-test.apk --prerelease --title "APK de test n°${{ github.run_number }} — $PARASHA" \
            --notes "Version de test. Paracha : $PARASHA (textes de Sefaria). Sur Android : télécharger shnayim-mikra-test.apk puis autoriser l'installation depuis cette source."
