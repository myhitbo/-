name: APK de test

on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', 'tools/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Textes depuis Sefaria (Israël et diaspora)
        run: node tools/fetch_sefaria.js

      - name: Copier l'application web dans l'APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: shnayim-mikra-test-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publier l'APK dans les Releases du dépôt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk shnayim-mikra-test.apk
          TAG="test-${{ github.run_number }}"
          PARASHA=$(node -e "global.window={};require('./web/data/text.js');const T=window.SM_TEXT;const t=new Date().toISOString().slice(0,10);const w=T&&T.diaspora?T.diaspora.weeks.find(x=>x.shabbatISO>=t&&!x.holiday):null;console.log(w?w.parasha:'textes d exemple')")
          gh release create "$TAG" shnayim-mikra-test.apk --prerelease --title "APK de test n°${{ github.run_number }} — $PARASHA" \
            --notes "Version de test. Paracha : $PARASHA (textes de Sefaria). Sur Android : télécharger shnayim-mikra-test.apk puis autoriser l'installation depuis cette source."
