name: APK de test

on:
  push:
    branches: [main]
    paths: ['web/**', 'android/**', 'tools/**', 'data/**', 'test/**', 'package.json', 'package-lock.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Tests (moteur des lectures contre hebcal, application, halakhot)
        run: |
          npm ci
          npm test

      - name: Données de l'application (texte, Targoum, lectures, halakhot ; sans réseau)
        run: node tools/construit_donnees.js

      - name: Copier l'application web dans l'APK
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r web/. android/app/src/main/assets/www/

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: shnayim-mikra-test-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publier l'APK dans les Releases du dépôt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk shnayim-mikra-test.apk
          TAG="test-${{ github.run_number }}"
          PARASHA=$(node -e "const L=require('./web/lecture.js');const D=require('./data/lecture_torah.json');console.log(L.parachaSemaine(D,new Date().toISOString().slice(0,10),{enIsrael:false}).lecture.titre.fr)")
          gh release create "$TAG" shnayim-mikra-test.apk --prerelease --title "APK de test n°${{ github.run_number }} — $PARASHA" \
            --notes "Version de test. Paracha de la semaine : $PARASHA. Toute la Torah, le Targoum Onkelos et les haftarot sont dans l'application, hors connexion. Sur Android : télécharger shnayim-mikra-test.apk puis autoriser l'installation depuis cette source."
