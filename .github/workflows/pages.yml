name: Site public (confidentialité, chaînes WhatsApp)

# Met en ligne sur GitHub Pages :
#   - la politique de confidentialité (docs/confidentialite.html), à la racine du site ;
#   - la page des messages des chaînes WhatsApp, sous /chaine/ (préparés par tools/make_channel.js).
# À faire une seule fois sur GitHub : Settings → Pages → Source : « GitHub Actions ».
# Tant que ce n'est pas fait, cette tâche ne publie rien et le signale sans échouer.
#
# Les messages des chaînes couvrent la semaine passée et les quatre suivantes : la tâche tourne deux fois
# par semaine pour avancer avec le calendrier. Si Sefaria ne répond pas, elle échoue et le site reste tel quel.
on:
  push:
    branches: [main]
    paths:
      - 'docs/confidentialite.html'
      - 'chaine/**'
      - 'tools/make_channel.js'
      - 'tools/fetch_sefaria.js'
      - 'web/sefaria.js'
      - 'web/globals.js'
      - 'web/config.js'
      - 'web/i18n.js'
      - 'web/i18n/**'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 1 * * 0,3'   # dimanche et mercredi, 1 h 17 (UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: GitHub Pages est-il activé ?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages n'est pas activé : Settings → Pages → Source « GitHub Actions », puis relancer cette tâche."
          fi

      - uses: actions/setup-node@v5
        if: steps.pages.outputs.ok == 'true'
        with:
          node-version: '22'

      - name: Textes depuis Sefaria (Israël et diaspora)
        if: steps.pages.outputs.ok == 'true'
        run: node tools/fetch_sefaria.js

      - name: Préparer le site
        if: steps.pages.outputs.ok == 'true'
        run: |
          mkdir _site
          cp docs/confidentialite.html _site/index.html
          cp docs/confidentialite.html _site/confidentialite.html
          node tools/make_channel.js _site/chaine

      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outputs.ok == 'true'
        with:
          path: _site

      - id: deploy
        if: steps.pages.outputs.ok == 'true'
        uses: actions/deploy-pages@v4
